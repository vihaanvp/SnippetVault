# =============================================================================
# SnippetVault — Docker Compose
#
# Zero-config quick start (any Docker host):
#   git clone https://github.com/vihaanvp/SnippetVault.git
#   cd SnippetVault
#   docker compose up -d
#   Open http://<your-host-ip>:5001
#
# No .env file needed for basic email/password auth.  For OAuth or custom
# settings, copy .env.example to .env, fill in your secrets, then restart:
#   docker compose up -d
#
# The image is multi-arch (linux/amd64 + linux/arm64) so it runs on
# Raspberry Pi 3/4/5, standard servers, and everything in between.
# =============================================================================

services:
  snippetvault:
    # Pre-built multi-arch image from GitHub Container Registry.
    # Docker automatically pulls the right variant for your architecture.
    image: ghcr.io/vihaanvp/snippetvault:latest
    container_name: snippetvault
    # Restart automatically after reboot (works with `sudo systemctl enable docker`)
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # --- Flask ---
      # SECRET_KEY is auto-generated & persisted on first start if not set.
      - SECRET_KEY=${SECRET_KEY:-}
      # --- OAuth: Google (leave empty to disable) ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # --- OAuth: GitHub (leave empty to disable) ---
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # --- Public URL (must match your domain exactly) ---
      # Set this if OAuth redirects fail behind a reverse proxy.
      - PUBLIC_URL=${PUBLIC_URL:-}
      # --- Registration toggle ---
      # Set to "false" to disable new account registration.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      # --- URL scheme (http if behind plain HTTP reverse proxy) ---
      - PREFERRED_URL_SCHEME=${PREFERRED_URL_SCHEME:-https}
      # --- Database path (inside container) ---
      - DATABASE_DIR=/app/data
      # --- Force Waitress production server ---
      - WAITRESS=1
    volumes:
      # Bind mount — creates a "data/" folder in the project directory.
      # Contains config.json, snippets.db, roles.json, and persists across restarts.
      - ./data:/app/data
