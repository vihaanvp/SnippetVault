# =============================================================================
# SnippetVault — Docker Compose
#
# Quick start:
#   1. Copy .env.example to .env and fill in your OAuth secrets
#   2. docker compose up -d
#   3. Open http://localhost:5001
# =============================================================================

version: "3.9"

services:
  snippetvault:
    build: .
    container_name: snippetvault
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # --- Flask ---
      - SECRET_KEY=${SECRET_KEY}
      # --- OAuth: Google ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # --- OAuth: GitHub ---
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # --- URL scheme (http if behind plain HTTP reverse proxy) ---
      - PREFERRED_URL_SCHEME=${PREFERRED_URL_SCHEME:-https}
      # --- Database path (inside container) ---
      - DATABASE_DIR=/app/data
      # --- Force Waitress production server ---
      - WAITRESS=1
    volumes:
      # Persistent SQLite database
      - snippetvault_data:/app/data

volumes:
  snippetvault_data:
