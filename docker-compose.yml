# =============================================================================
# SnippetVault — Docker Compose
#
# Quick start (Raspberry Pi / any Docker host):
#   1. Copy .env.example to .env and fill in your secrets
#   2. docker compose up -d
#   3. Open http://<your-pi-ip>:5001
#
# The image is multi-arch (linux/amd64 + linux/arm64) so it runs on
# Raspberry Pi 3/4/5, standard servers, and everything in between.
# =============================================================================

services:
  snippetvault:
    # Pre-built multi-arch image from GitHub Container Registry.
    # Docker automatically pulls the right variant for your architecture.
    image: ghcr.io/vihaanvp/snippetvault:latest
    container_name: snippetvault
    # Restart automatically after reboot (works with `sudo systemctl enable docker`)
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # --- Flask ---
      - SECRET_KEY=${SECRET_KEY}
      # --- OAuth: Google ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # --- OAuth: GitHub ---
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # --- Public URL (must match your domain exactly) ---
      - PUBLIC_URL=${PUBLIC_URL:-https://snippetvault.vihaanvp.me}
      # --- URL scheme (http if behind plain HTTP reverse proxy) ---
      - PREFERRED_URL_SCHEME=${PREFERRED_URL_SCHEME:-https}
      # --- Database path (inside container) ---
      - DATABASE_DIR=/app/data
      # --- Force Waitress production server ---
      - WAITRESS=1
    volumes:
      # Persistent SQLite database (survives container restarts)
      - snippetvault_data:/app/data

volumes:
  snippetvault_data:
